baseURL = 'https://nssaker1208.github.io/Blog-s_VuManhCuong/'
languageCode = 'vi'
title = 'Blog Lập Trình Mạng'
theme = 'PaperMod'

[params]
  description = "Chia sẻ kiến thức về Java & JavaScript Network Programming"
  author = "Vũ Mạnh Cường"
  ShowReadingTime = true
  ShowShareButtons = true
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  comments = true
  hideSiteTitleInHeader = true

  # Home-Info Mode Configuration
  [params.homeInfoParams]
    Title = "Chào mừng đến Blog Lập Trình Mạng 👋"
    Content = """
Xin chào! Tôi là **Vũ Mạnh Cường**, sinh viên Công nghệ phần mềm tại HUTECH.

Blog này là nơi tôi chia sẻ kiến thức về **Java**, **JavaScript**, **Network Programming** và các công nghệ liên quan.

📚 Khám phá các bài viết về Socket Programming, REST API, và nhiều chủ đề thú vị khác!
    """

  # Social Icons
  [[params.socialIcons]]
    name = "github"
    url = "https://github.com/yourusername"

  [[params.socialIcons]]
    name = "linkedin"
    url = "https://linkedin.com/in/yourprofile"

  [[params.socialIcons]]
    name = "email"
    url = "mailto:your@email.com"

  [[params.socialIcons]]
    name = "facebook"
    url = "https://facebook.com/yourprofile"

# Menu Configuration
[[menu.main]]
  identifier = 'home'
  name = 'Home'
  url = '/'
  weight = 1

[[menu.main]]
  identifier = 'blog'
  name = 'Blog'
  url = '/posts'
  weight = 2

[[menu.main]]
  identifier = 'about'
  name = 'About'
  url = '/about'
  weight = 3

[[menu.main]]
  identifier = 'portfolio'
  name = 'Portfolio'
  url = '/portfolio'
  weight = 4

# Markup Configuration
[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

# Pagination
[pagination]
  pagerSize = 10
