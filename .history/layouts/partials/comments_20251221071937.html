{{- if and .Params.comments (eq .Type "posts") -}}
<div style="margin-top: 3rem; padding-top: 2rem; border-top: 1px solid #e5e7eb">
  <h3 style="margin-bottom: 1.5rem; font-size: 1.25rem; font-weight: 600">
    💬 Bình luận & Thảo luận
  </h3>

  <div
    style="
      background: #fff;
      padding: 1.5rem;
      border-radius: 8px;
      border: 1px solid #e5e7eb;
    "
  >
    <script
      src="https://giscus.app/client.js"
      data-repo="nssaker1208/Blog-s_VuManhCuong"
      data-repo-id="R_kgDOQsFoig"
      data-category="Announcements"
      data-category-id="DIC_kwDOQsFois4C0Czk"
      data-mapping="pathname"
      data-strict="0"
      data-reactions-enabled="1"
      data-emit-metadata="0"
      data-input-position="bottom"
      data-theme="preferred_color_scheme"
      data-lang="vi"
      crossorigin="anonymous"
      async
    ></script>
  </div>
</div>

<script>
  function setGiscusTheme() {
    const theme = document.body.classList.contains("dark") ? "dark" : "light";
    const iframe = document.querySelector("iframe.giscus-frame");

    if (iframe) {
      iframe.contentWindow.postMessage(
        { giscus: { setConfig: { theme: theme } } },
        "https://giscus.app"
      );
    }
  }

  window.addEventListener("message", (event) => {
    if (event.origin === "https://giscus.app" && event.data.giscus) {
      setGiscusTheme();
    }
  });

  const observer = new MutationObserver(() => {
    setGiscusTheme();
  });

  observer.observe(document.body, {
    attributes: true,
    attributeFilter: ["class"],
  });
</script>
{{- end -}}
