{{- if and .Params.comments (eq .Type "posts") -}}
<div style="margin-top: 3rem; padding-top: 2rem; border-top: 1px solid #e5e7eb">
  <h3 style="margin-bottom: 1.5rem; font-size: 1.25rem; font-weight: 600">
    💬 Bình luận & Thảo luận
  </h3>

  <div
    class="giscus-container"
    style="
      background: var(--entry);
      padding: 1.5rem;
      border-radius: 8px;
      border: 1px solid var(--border);
    "
  >
    <script
      src="https://giscus.app/client.js"
      data-repo="nssaker1208/Blog-s_VuManhCuong"
      data-repo-id="R_kgDOQsFoig"
      data-category="Announcements"
      data-category-id="DIC_kwDOQsFois4C0Czk"
      data-mapping="pathname"
      data-strict="0"
      data-reactions-enabled="1"
      data-emit-metadata="0"
      data-input-position="bottom"
      data-theme="light"
      data-lang="vi"
      crossorigin="anonymous"
      async
    ></script>
  </div>
</div>

<script>
  // Đợi Giscus load xong
  window.addEventListener("message", function (event) {
    if (event.origin !== "https://giscus.app") return;

    // Sau khi Giscus ready, set theme đúng
    if (event.data.giscus && event.data.giscus.discussion) {
      setGiscusTheme();
    }
  });

  // Hàm set theme cho Giscus
  function setGiscusTheme() {
    const isDark =
      document.body.classList.contains("dark") ||
      document.body.getAttribute("data-theme") === "dark";
    const theme = isDark ? "dark" : "light";

    const iframe = document.querySelector("iframe.giscus-frame");
    if (iframe) {
      iframe.contentWindow.postMessage(
        { giscus: { setConfig: { theme: theme } } },
        "https://giscus.app"
      );
    }
  }

  // Lắng nghe khi user chuyển theme
  const themeObserver = new MutationObserver(function (mutations) {
    mutations.forEach(function (mutation) {
      if (
        mutation.type === "attributes" &&
        (mutation.attributeName === "class" ||
          mutation.attributeName === "data-theme")
      ) {
        setGiscusTheme();
      }
    });
  });

  // Theo dõi thay đổi trên body
  themeObserver.observe(document.body, {
    attributes: true,
    attributeFilter: ["class", "data-theme"],
  });

  // Set theme ngay khi load trang
  document.addEventListener("DOMContentLoaded", function () {
    setTimeout(setGiscusTheme, 1000); // Đợi 1s để Giscus load
  });
</script>
{{- end -}}
