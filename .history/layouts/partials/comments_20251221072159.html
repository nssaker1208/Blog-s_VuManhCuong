{{- if and .Params.comments (eq .Type "posts") -}}
<div
  style="
    margin-top: 3rem;
    padding-top: 2rem;
    border-top: 1px solid var(--border);
  "
>
  <h3
    style="
      margin-bottom: 1.5rem;
      font-size: 1.25rem;
      font-weight: 600;
      color: var(--content);
    "
  >
    💬 Bình luận & Thảo luận
  </h3>

  <div style="padding: 1.5rem; border-radius: 8px">
    <script
      src="https://giscus.app/client.js"
      data-repo="nssaker1208/Blog-s_VuManhCuong"
      data-repo-id="R_kgDOQsFoig"
      data-category="Announcements"
      data-category-id="DIC_kwDOQsFois4C0Czk"
      data-mapping="pathname"
      data-strict="0"
      data-reactions-enabled="1"
      data-emit-metadata="0"
      data-input-position="bottom"
      data-theme="transparent_dark"
      data-lang="vi"
      crossorigin="anonymous"
      async
    ></script>
  </div>
</div>

<script>
  function setGiscusTheme() {
    const isDark =
      document.documentElement.classList.contains("dark") ||
      document.body.classList.contains("dark");
    const theme = isDark ? "transparent_dark" : "light";

    const iframe = document.querySelector("iframe.giscus-frame");
    if (iframe) {
      iframe.contentWindow.postMessage(
        { giscus: { setConfig: { theme: theme } } },
        "https://giscus.app"
      );
    }
  }

  // Lắng nghe khi Giscus load xong
  window.addEventListener("message", (e) => {
    if (e.origin === "https://giscus.app" && e.data.giscus) {
      setTimeout(setGiscusTheme, 500);
    }
  });

  // Lắng nghe khi chuyển theme
  const observer = new MutationObserver(setGiscusTheme);
  observer.observe(document.documentElement, {
    attributes: true,
    attributeFilter: ["class"],
  });
  observer.observe(document.body, {
    attributes: true,
    attributeFilter: ["class"],
  });
</script>
{{- end -}}
