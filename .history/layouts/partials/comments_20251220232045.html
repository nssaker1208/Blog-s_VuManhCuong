{{- if .Params.comments -}}
<div
  style="
    margin-top: 3rem;
    padding-top: 2rem;
    border-top: 1px solid var(--border);
  "
>
  <h3 style="margin-bottom: 1.5rem; font-size: 1.25rem; font-weight: 600">
    💬 Bình luận & Thảo luận
  </h3>

  <div
    class="giscus-wrapper"
    style="background: var(--entry); padding: 1.5rem; border-radius: 8px"
  >
    <script
      src="https://giscus.app/client.js"
      data-repo="nssaker1208/Blog-s_VuManhCuong"
      data-repo-id="R_kgDOQsFoig"
      data-category="Announcements"
      data-category-id="YOUR_CATEGORY_ID"
      data-mapping="pathname"
      data-strict="0"
      data-reactions-enabled="1"
      data-emit-metadata="0"
      data-input-position="bottom"
      data-theme="light"
      data-lang="vi"
      crossorigin="anonymous"
      async
    ></script>
  </div>
</div>

<!-- Script đồng bộ theme -->
<script>
  function setGiscusTheme() {
    const theme = document.body.classList.contains("dark") ? "dark" : "light";
    const iframe = document.querySelector("iframe.giscus-frame");

    if (iframe) {
      iframe.contentWindow.postMessage(
        { giscus: { setConfig: { theme: theme } } },
        "https://giscus.app"
      );
    }
  }

  // Chạy khi Giscus load xong
  window.addEventListener("message", (event) => {
    if (event.origin === "https://giscus.app" && event.data.giscus) {
      setGiscusTheme();
    }
  });

  // Lắng nghe khi user bấm nút đổi theme
  const observer = new MutationObserver(() => {
    setGiscusTheme();
  });

  observer.observe(document.body, {
    attributes: true,
    attributeFilter: ["class"],
  });
</script>
{{- end -}}
